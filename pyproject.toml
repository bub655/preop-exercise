[project]
name = "preop-triage"
version = "0.1.0"
description = "Deterministic, grounded pre-op scheduling triage for Cadence Surgical Center"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "pyyaml>=6.0",
    "anthropic>=2.3.0",
    "textual>=1.0.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["preop_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
